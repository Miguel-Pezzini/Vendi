spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vendi}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1000

spring.application.name=vendi
api.security.token.secret=${JWT_SECRET:changeme-dev-only}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3333}
app.photo-storage.path=${PHOTO_STORAGE_PATH:${user.home}/.vendi/photos}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Prometheus config
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.access=read-only
management.metrics.tags.application=my-spring-app
